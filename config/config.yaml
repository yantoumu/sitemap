# 网站地图关键词分析工具 - 系统配置

# SEO API配置 (已废弃但保留以满足验证要求)
seo_api:
  urls: []  # 空列表，SEO功能已移除
  interval: 2.0  # 请求间隔（秒）
  batch_size: 5  # 每批查询关键词数量
  timeout: 60    # 请求超时时间

# 后端API配置 (使用新的简化架构)
backend_api:
  url: "${SITEMAP_API_URL}"  # 新的简化后端API地址
  auth_token: "${SITEMAP_SECRET_KEY}"  # 新的API密钥
  batch_size: 500  # 批量提交大小
  timeout: 40

# 注意：关键词指标API现在统一使用backend_api配置

# 系统配置
system:
  max_concurrent: 20     # 最大并发数
  retry_times: 3         # 重试次数
  retry_delay: 1.0       # 重试延迟（秒）

# 存储配置
storage:
  encryption_key: "${ENCRYPTION_KEY}"
  storage_file: "data/processed_urls.json"
  data_retention_days: 365  # 数据保留天数，365天

# 缓存配置
cache:
  ttl: 604800  # 缓存TTL（7天，秒）

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/sitemap_analyzer.log"
  max_size: "10MB"
  backup_count: 5
